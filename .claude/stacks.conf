# Which parts of .claude each technology stack gets. Read by `mise run agents`
# (.config/scripts/sync-agents.sh) from the root of the "agents" branch.

[detect]
# Used when `mise run agents` is called without a stack.
# <technology>  <glob>[:<regex>]   relative to the project root; with :regex a matching file must contain it
nextjs          src/*/next.config.*
web             src/*/next.config.*
web             src/*/vite.config.*
web             src/*/index.html
tailwind        src/*/package.json:"tailwindcss"
tailwind        src/*/tailwind.config.*
python          src/*/pyproject.toml
fastapi         src/*/pyproject.toml:fastapi
terraform       .config/terraform/*.tf

[install]
# <path under .claude, glob allowed>   <technology>...   ("always" = every project)
skills/code-reviewer                   always
skills/remove-comments                 always
skills/nextjs-*                        nextjs
skills/feature-sliced-design           tailwind
skills/tailwind-best-practices         tailwind
skills/accessibility-*                 web
skills/shared                          web

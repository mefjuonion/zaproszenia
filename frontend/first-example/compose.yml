# Local dev service, included by .config/docker-compose.yml. Paths are relative to this file.
services:
  __NAME__:
    build:
      context: .
      dockerfile: Dockerfile.dev
    platform: linux/arm64
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
